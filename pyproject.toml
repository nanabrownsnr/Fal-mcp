# Python project, dependency, test, and lint configuration
[project]
name = "fal-mcp"
version = "0.1.0"
description = "A FastMCP server for calling AI models via fal.ai API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=50.0.1",
    "fastmcp==3.4.5",
    "fal>=0.5.0",  # fal.ai client for AI model calls
    "httpx==0.28.1",
    "pydantic-settings==2.14.2",
    "python-dotenv==1.2.2",
    "pymongo>=4.18.0",
    "python-jose[cryptography]==3.5.0",  # For JWT if Twynity needs it
    "starlette==1.3.1",
    "uvicorn==0.51.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

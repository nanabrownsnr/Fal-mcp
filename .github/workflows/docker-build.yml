name: Docker Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and cache Docker layers
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ env.REGISTRY }}/nanabrownsnr/fal-mcp:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run health check
        run: |
          docker run --rm \
            --name fal-mcp-health \
            -e MONGODB_URI="mongodb://test:test@localhost:27017/test" \
            -e ENCRYPTION_KEY=dGVzdC1rZXktZm9yLXRoZS10ZXN0aW5n \
            ${{ env.REGISTRY }}/nanabrownsnr/fal-mcp:${{ github.sha }} \
            uvicorn app.main:mcp --host 0.0.0.0 --port 8000 &
          sleep 10
          docker ps
          curl http://localhost:8000/health || true
        env:
          UVICORN_LOG_LEVEL: info
